name: Copilot Code Review

on:
  pull_request:
    branches: [ master, main ]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Copilot Code Review
        uses: github/copilot-github-actions/code-review@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_instructions_path: Plugins/Unreal-Dualsense/.github/custom-instructions.json
